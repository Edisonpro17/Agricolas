<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col">

    <div id="loginView" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-8">
                <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Acceso Seguro</h1>
                <p class="text-slate-500 text-sm">Ingresa tus credenciales para facturar</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ingrese su usuario" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md">
                    Entrar al Sistema
                </button>
            </form>
            <p id="loginError" class="text-red-500 text-sm text-center mt-4 hidden"></p>
        </div>
    </div>

    <div id="appView" class="hidden min-h-screen bg-slate-50">
        <nav class="bg-slate-800 text-white shadow-lg">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="text-lg font-bold"><i class="fa-solid fa-file-invoice mr-2"></i>Facturador Pro</div>
                <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 py-1 px-3 rounded transition">
                    <i class="fa-solid fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-6 py-10 max-w-4xl">
            <div class="bg-white rounded-xl shadow-md p-8 border border-slate-100">
                <h2 class="text-2xl font-bold mb-6 text-slate-700">Generar Facturas</h2>
                
                <form id="uploadForm" class="space-y-6">
                    
                    <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                        <label class="block text-sm font-bold text-blue-800 mb-2">1. Archivo Excel (.xlsx)</label>
                        <input id="excelFile" type="file" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200" accept=".xlsx" required />
                    </div>

                    <div class="p-4 bg-green-50 rounded-lg border border-green-100">
                        <label class="block text-sm font-bold text-green-800 mb-2">2. Firma Electrónica (.p12)</label>
                        <div class="flex flex-col md:flex-row gap-4">
                            <input id="firmaFile" type="file" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-100 file:text-green-700 hover:file:bg-green-200" accept=".p12" required />
                            
                            <input type="password" id="claveFirma" placeholder="Contraseña de la firma" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white" required>
                        </div>
                        <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-shield-alt"></i> Tu firma se procesa de forma segura y se borra inmediatamente.</p>
                    </div>

                    <button type="submit" id="btnProcesar" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-lg transition transform active:scale-95 shadow-lg text-lg">
                        <i class="fa-solid fa-play mr-2"></i> Procesar Documentos
                    </button>
                </form>

                <div id="statusArea" class="hidden mt-6 p-4 rounded-lg bg-gray-50 border border-gray-200 text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-slate-800 mb-2"></div>
                    <p id="statusText" class="font-medium text-slate-700">Trabajando...</p>
                </div>
            </div>

            <div id="resultArea" class="hidden mt-8">
                <h3 class="text-xl font-bold mb-4 text-slate-700">Reporte Final</h3>
                <div class="overflow-x-auto bg-white rounded-lg shadow border">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                            <tr>
                                <th class="px-6 py-3">Documento</th>
                                <th class="px-6 py-3">Estado</th>
                                <th class="px-6 py-3">Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. RECUPERAR SESIÓN GUARDADA
        let TOKEN = localStorage.getItem('facturador_token');

        if (TOKEN) {
            mostrarApp();
        }

        function mostrarApp() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appView').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('facturador_token');
            TOKEN = null;
            location.reload();
        }

        // --- LÓGICA DE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // <--- ¡ESTA LÍNEA ES LA QUE EVITA QUE SE RECARGUE LA PÁGINA!
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');

            // Limpiar errores previos
            errorMsg.textContent = "";
            errorMsg.classList.add('hidden');
            errorMsg.className = "text-red-500 text-sm text-center mt-4 hidden"; 

            const formData = new URLSearchParams();
            formData.append('username', user);
            formData.append('password', pass);

            try {
                const res = await fetch('/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });

                // CASO 1: Éxito
                if(res.ok) {
                    const data = await res.json();
                    TOKEN = data.access_token;
                    localStorage.setItem('facturador_token', TOKEN);
                    mostrarApp();
                
                // CASO 2: Bloqueo (Cooldown)
                } else if (res.status === 429) {
                    errorMsg.innerHTML = `<i class="fa-solid fa-hand-paper"></i> <b>¡ALTO AHÍ!</b><br>Espera 1 minuto.`;
                    errorMsg.className = "text-orange-600 text-sm text-center mt-4 bg-orange-100 p-3 rounded-lg border border-orange-200";
                    errorMsg.classList.remove('hidden');

                // CASO 3: Error credenciales
                } else if (res.status === 401) {
                    errorMsg.textContent = "Usuario o contraseña incorrectos";
                    errorMsg.className = "text-red-500 text-sm text-center mt-4";
                    errorMsg.classList.remove('hidden');

                } else {
                    errorMsg.textContent = "Error inesperado.";
                    errorMsg.classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Error de conexión";
                errorMsg.classList.remove('hidden');
            }
        });

        // --- LÓGICA DE PROCESAMIENTO ---
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnProcesar');
            const status = document.getElementById('statusArea');
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.classList.remove('hidden');
            resultArea.classList.add('hidden');
            statusText.textContent = "Subiendo archivos y procesando...";

            const formData = new FormData();
            formData.append('file_excel', document.getElementById('excelFile').files[0]);
            formData.append('file_firma', document.getElementById('firmaFile').files[0]);
            formData.append('clave_firma', document.getElementById('claveFirma').value);

            try {
                const response = await fetch('/procesar-facturas', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}` },
                    body: formData
                });

                if (response.status === 401) {
                    alert("Tu sesión ha expirado.");
                    logout();
                    return;
                }

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Error en el servidor');

                renderTable(data.detalle);
                statusText.textContent = `¡Listo! Procesados: ${data.total_procesados}`;
                resultArea.classList.remove('hidden');

            } catch (error) {
                alert("Error: " + error.message);
                statusText.textContent = "Error: " + error.message;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        });

        function renderTable(detalles) {
            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = '';
            
            detalles.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "bg-white border-b hover:bg-gray-50";
                
                let color = item.estado === 'OK' ? 'text-green-600' : 'text-red-600';
                let icon = item.estado === 'OK' ? 'check-circle' : 'exclamation-circle';

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium">${item.factura}</td>
                    <td class="px-6 py-4 ${color} font-bold"><i class="fa-solid fa-${icon}"></i> ${item.estado}</td>
                    <td class="px-6 py-4 text-gray-600">${item.mensaje}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
